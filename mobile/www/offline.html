<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentForge AI</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #fff8e8; color: #111827;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px; box-sizing: border-box; text-align: center;
  }
  .box { max-width: 320px; }
  .mark {
    width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 22px;
    background: linear-gradient(135deg, #22d3ee, #3b82f6 55%, #7c3aed);
    display: flex; align-items: center; justify-content: center;
  }
  h1 { font-size: 20px; margin: 0 0 8px; font-weight: 800; }
  p { font-size: 14px; line-height: 1.6; margin: 0 0 22px; color: rgba(17, 24, 39, .6); }
  button {
    appearance: none; border: 0; border-radius: 16px; padding: 14px 28px;
    font-size: 15px; font-weight: 800; color: #fff; width: 100%;
    background: linear-gradient(90deg, #22d3ee, #2563eb);
  }
</style>
</head>
<body>
  <div class="box">
    <div class="mark" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.6a10.5 10.5 0 0 1 14 0"/><path d="M8.5 16.2a6 6 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1" fill="#fff"/>
      </svg>
    </div>
    <h1>Internet nahi mil raha</h1>
    <p>AgentForge ko chalane ke liye internet chahiye. Connection check karke dobara try karein.</p>
    <button type="button" onclick="location.replace('https://www.aiagentforge.in/')">Dobara try karein</button>
  </div>
</body>
</html>
